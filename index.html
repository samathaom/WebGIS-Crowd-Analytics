<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS - Real-Time Crowd Analytics</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { height: 100%; width: 100%; background: #F9F9F9; overflow: hidden; display: flex; }
        
        #map { flex: 1; height: 100%; }

        .panel {
            width: 340px;
            background: #FFFFFF;
            border-right: 1px solid #E5E5E5;
            display: flex;
            flex-direction: column;
            padding: 24px;
            z-index: 1000;
        }

        h1 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #888888; margin-bottom: 4px; }
        .heading { font-size: 18px; font-weight: 400; color: #111111; margin-bottom: 24px; }
        
        .status-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 32px; }
        .indicator { width: 6px; height: 6px; border-radius: 50%; background: #10B981; }
        .indicator-text { font-size: 11px; font-weight: 600; text-transform: uppercase; color: #10B981; letter-spacing: 0.5px; }
        
        .metric-card { background: #F4F4F5; border: 1px solid #E4E4E7; padding: 16px; border-radius: 6px; margin-bottom: 32px; }
        .label { font-size: 9px; text-transform: uppercase; color: #71717A; letter-spacing: 1px; margin-bottom: 4px; }
        .value { font-size: 24px; font-weight: 300; color: #18181B; font-variant-numeric: tabular-nums; }

        .chart-box { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
        .chart-label { font-size: 9px; text-transform: uppercase; color: #71717A; letter-spacing: 1px; margin-bottom: 12px; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>Autonomous Monitor</h1>
        <div class="heading">Hill View Stadium Hub</div>
        
        <div class="status-bar">
            <div id="ind" class="indicator"></div>
            <div id="ind-text" class="indicator-text">Optimal Flow</div>
        </div>

        <div class="metric-card">
            <div class="label">Open Field Core Density</div>
            <div id="count" class="value">0</div>
        </div>

        <div class="chart-box">
            <div class="chart-label">Fluid Density Trend</div>
            <canvas id="liveChart"></canvas>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // Set coordinates to Sri Sathya Sai Hill View Stadium, Puttaparthi
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([14.1622, 77.8139], 16);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

        L.tileLayer.wms('https://bhuvan-vec1.nrsc.gov.in/bhuvan/wms', {
            layers: 'bhuvan_nuis_base',
            format: 'image/png',
            transparent: true,
            opacity: 0.5
        }).addTo(map);

        const targetAnchor = [14.1622, 77.8139];
        let spatialVectorGroup = L.layerGroup().addTo(map);

        // Lower baseline trackers to represent a sparsely populated zone
        let currentDisplayCount = 12;
        let targetCount = 12;

        const ctx = document.getElementById('liveChart').getContext('2d');
        const timelineLimit = 25;
        
        const liveChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(timelineLimit).fill(''),
                datasets: [{
                    data: Array(timelineLimit).fill(12),
                    borderColor: '#10B981',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    tension: 0.2,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 0 },
                plugins: { legend: { display: false } },
                scales: { 
                    x: { display: false }, 
                    y: { min: 0, max: 100, grid: { color: '#F4F4F5' }, ticks: { color: '#A1A1AA', font: { size: 9 } } } 
                }
            }
        });

        // Simulates the naturally sparse telemetry of an open stadium area (ranging between 5 to 25 people)
        function fetchRawTarget() {
            targetCount = Math.floor(5 + (Math.random() * 20));
        }

        function renderLoop() {
            const delta = targetCount - currentDisplayCount;
            
            if (Math.abs(delta) > 0.1) {
                currentDisplayCount += delta * 0.05;
            } else {
                currentDisplayCount = targetCount;
            }

            const integerCount = Math.round(currentDisplayCount);

            let coreColor = '#10B981';
            let strokeColor = '#047857';
            let statusMessage = 'Optimal Flow';

            // Stadium thresholds remain well within optimal limits due to low ambient usage
            if (integerCount > 75) {
                coreColor = '#EF4444'; strokeColor = '#B91C1C'; statusMessage = 'Critical Density';
            } else if (integerCount > 45) {
                coreColor = '#F59E0B'; strokeColor = '#B45309'; statusMessage = 'Approaching Limit';
            }

            spatialVectorGroup.clearLayers();
            L.circle(targetAnchor, {
                radius: 15 + (integerCount * 0.4),
                fillColor: coreColor,
                fillOpacity: 0.25,
                color: strokeColor,
                weight: 1
            }).addTo(spatialVectorGroup);

            document.getElementById('count').innerText = integerCount;
            const textEl = document.getElementById('ind-text');
            const dotEl = document.getElementById('ind');
            
            textEl.innerText = statusMessage;
            textEl.style.color = coreColor;
            dotEl.style.background = coreColor;

            liveChart.data.datasets[0].data.push(integerCount);
            liveChart.data.datasets[0].data.shift();
            liveChart.data.datasets[0].borderColor = coreColor;
            liveChart.update();

            requestAnimationFrame(renderLoop);
        }

        fetchRawTarget();
        renderLoop();
        setInterval(fetchRawTarget, 2500);
    </script>
</body>
</html>
